name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview:
    if: >-
      github.repository == 'VKrebs/code-a-la-carte' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            wrangler.jsonc
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: wrangler
        name: Read wrangler version
        run: echo "version=$(node -p "require('./package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - name: Delete preview
        run: npx --yes "wrangler@$WRANGLER_VERSION" preview delete --name "pr-$PR_NUMBER" --skip-confirmation
        env:
          WRANGLER_VERSION: ${{ steps.wrangler.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
