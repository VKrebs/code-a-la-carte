name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview:
    if: >-
      github.repository == 'VKrebs/code-a-la-carte' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            wrangler.jsonc
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: wrangler
        name: Read wrangler version
        run: |
          version=$(node -p "require('./package.json').devDependencies.wrangler")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected wrangler version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Delete preview
        run: npx --yes "wrangler@$WRANGLER_VERSION" preview delete --name "pr-$PR_NUMBER" --skip-confirmation
        env:
          WRANGLER_VERSION: ${{ steps.wrangler.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
