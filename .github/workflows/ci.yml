name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: test
    if: github.repository == 'VKrebs/code-a-la-carte' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://codealacarte.dev
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            wrangler.jsonc
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - id: wrangler
        name: Read wrangler version
        run: |
          version=$(node -p "require('./package.json').devDependencies.wrangler")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected wrangler version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy
        env:
          WRANGLER_VERSION: ${{ steps.wrangler.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live site
        run: |
          curl --fail --silent --show-error --location --output /dev/null \
            --retry 5 --retry-delay 10 --retry-all-errors \
            https://codealacarte.dev/t/001

  deploy-preview:
    needs: test
    if: >-
      github.repository == 'VKrebs/code-a-la-carte' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            wrangler.jsonc
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - id: wrangler
        name: Read wrangler version
        run: |
          version=$(node -p "require('./package.json').devDependencies.wrangler")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected wrangler version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy preview
        shell: bash
        run: npx --yes "wrangler@$WRANGLER_VERSION" preview --name "pr-$PR_NUMBER" | tee preview.log
        env:
          WRANGLER_VERSION: ${{ steps.wrangler.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Check the preview
        run: |
          url=$(grep -o -m 1 'https://[^ ]*\.workers\.dev' preview.log)
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --location --output /dev/null \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "$url/t/001"
